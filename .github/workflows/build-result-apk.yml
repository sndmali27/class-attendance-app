name: Build Class 6 Result APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'result-app/**'
      - '.github/workflows/build-result-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: result-app
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: class6-result-debug-apk
          path: result-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
