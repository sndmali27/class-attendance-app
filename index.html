const attendance = {};

function todayString() {
  const d = new Date();

  return d.toLocaleDateString("en-IN", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    weekday: "long"
  });
}

document.getElementById("today").innerText = todayString();

function createStudents() {

  const list = document.getElementById("studentList");

  students.forEach((name, index) => {

    attendance[index] = {
      status: "Present",
      remark: ""
    };

    const div = document.createElement("div");

    div.className = "student";

    div.innerHTML = `
      <div class="student-top">

        <div class="roll">
          ${index + 1}
        </div>

        <div class="name">
          ${name}
        </div>

        <select onchange="changeStatus(${index}, this.value)">
          <option value="Present">Present</option>
          <option value="Absent">Absent</option>
          <option value="Late">Late</option>
        </select>

      </div>

      <div class="remark" id="remark${index}">
      </div>
    `;

    list.appendChild(div);
  });

}

function changeStatus(index, status) {

  attendance[index].status = status;

  if (status === "Absent") {

    attendance[index].remark = "Without Permission";

  } else {

    attendance[index].remark = "";

  }

  updateScreen();
}

function updateScreen() {

  let present = 0;
  let absent = 0;
  let late = 0;

  students.forEach((name, index) => {

    if (attendance[index].status === "Present") {
      present++;
    }

    if (attendance[index].status === "Absent") {
      absent++;
    }

    if (attendance[index].status === "Late") {
      late++;
    }

    document.getElementById("remark" + index).innerText =
      attendance[index].remark
        ? "Remark: " + attendance[index].remark
        : "";

  });

  document.getElementById("presentCount").innerText = present;
  document.getElementById("absentCount").innerText = absent;
  document.getElementById("lateCount").innerText = late;
}

function generateWhatsApp() {

  let message = "";

  message += "📅 उपस्थिती – " + todayString() + "\n\n";

  message += "🔴 अनुपस्थित विद्यार्थी\n";

  let absentFound = false;

  students.forEach((name, index) => {

    if (attendance[index].status === "Absent") {

      absentFound = true;

      message +=
        (index + 1) +
        ". " +
        name +
        " — " +
        attendance[index].remark +
        "\n";
    }

  });

  if (!absentFound) {
    message += "None\n";
  }

  message += "\n🟡 उशिरा आलेले विद्यार्थी\n";

  let lateFound = false;

  students.forEach((name, index) => {

    if (attendance[index].status === "Late") {

      lateFound = true;

      message +=
        (index + 1) +
        ". " +
        name +
        " — Late\n";
    }

  });

  if (!lateFound) {
    message += "None\n";
  }

  message += "\n👥 एकूण विद्यार्थी: " + students.length;

  message +=
    "\n🟢 उपस्थित: " +
    document.getElementById("presentCount").innerText;

  message +=
    "\n🔴 अनुपस्थित: " +
    document.getElementById("absentCount").innerText;

  message +=
    "\n🟡 उशिरा: " +
    document.getElementById("lateCount").innerText;

  const box = document.getElementById("messageBox");

  box.style.display = "block";

  box.value = message;

  box.select();

  navigator.clipboard.writeText(message);

  alert("WhatsApp message copied. Paste it in your class WhatsApp group.");

}

function resetToday() {

  if (!confirm("Reset today's attendance?")) {
    return;
  }

  students.forEach((name, index) => {

    attendance[index].status = "Present";
    attendance[index].remark = "";

  });

  document.querySelectorAll("select").forEach(select => {
    select.value = "Present";
  });

  updateScreen();

}

updateScreen();
